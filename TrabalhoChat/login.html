<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Chat IFRN</title>
  <link rel="stylesheet" href="CSS/login.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

  <header>
    <h1>WizzApp</h1>
  </header>


  <main>
    <div class="login-box">
      <h2>Login</h2>

      <input type="text" id="user" placeholder="Usuário">

      <div class="senha-container">

        <input type="password" id="senha" placeholder="Senha">

        <span class="olho" onclick="mostrarSenha()">
          <i class="fa-solid fa-eye"></i>
        </span>

      </div>

      <button onclick="login()">Entrar</button>

    </div>
  </main>


  <footer class="footer">

    <div class="footer-left">
      <img src="IMG/logo.png" alt="Logo IFRN">
    </div>

    <div class="footer-center">
      <p>IFRN campus Santa Cruz</p>
      <p>Trabalho de Programação para Internet</p>
      <p>Prof. Marcelo Figueiredo Barbosa Júnior</p>
    </div>

    <div class="footer-right">
      <p><strong>Desenvolvedores:</strong></p>
      <p><a href="dev.html">Ver equipe de desenvolvedores</a></p>

      <p><strong>Tecnologias usadas:</strong></p>
      <p class="tecnologias">
        <a href="https://developer.mozilla.org/pt-BR/docs/Web/HTML" target="_blank">HTML</a> •
        <a href="https://developer.mozilla.org/pt-BR/docs/Web/CSS" target="_blank">CSS</a> •
        <a href="https://developer.mozilla.org/pt-BR/docs/Web/JavaScript" target="_blank">JavaScript</a> •
        <a href="https://developer.mozilla.org/pt-BR/docs/Web/API/Window/localStorage" target="_blank">LocalStorage</a>
      </p>
    </div>

  </footer>

  <script src="JS/login.js"></script>
</body>

</html>
